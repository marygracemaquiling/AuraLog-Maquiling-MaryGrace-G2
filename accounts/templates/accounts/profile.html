{% extends 'accounts/base.html' %}

{% block content %}
    <h2>My Profile</h2>
    <p><strong>Role:</strong> {{ user.get_role_display }} | <strong>Member Since:</strong> {{ user.created_at|date:"F j, Y" }}</p>

    {% if user.profile_photo %}
        <div style="margin-bottom: 15px;">
            <img src="{{ user.profile_photo.url }}" alt="Profile Photo" style="width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 2px solid #f59e0b;">
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
{% endblock %}
